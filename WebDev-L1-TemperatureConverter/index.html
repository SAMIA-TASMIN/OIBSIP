<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Convert temperatures between Celsius, Fahrenheit, and Kelvin."><title>Thermo — Temperature Converter</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body><main class="app"><header class="top"><a class="logo" href="#">thermo<span>.</span></a><span class="tag">TEMPERATURE TOOL</span></header><section class="intro"><p class="eyebrow">A little clarity, in degrees</p><h1>Temperature,<br><em>translated.</em></h1><p class="sub">Convert between Celsius, Fahrenheit, and Kelvin with precision and ease.</p></section><form id="converter" novalidate><label for="temperature">Temperature value</label><div class="input-row"><input id="temperature" name="temperature" type="number" step="any" inputmode="decimal" placeholder="e.g. 25" aria-describedby="error"><label class="sr-only" for="unit">Input unit</label><select id="unit" name="unit"><option value="C">°C</option><option value="F">°F</option><option value="K">K</option></select></div><p id="error" class="error" role="alert" aria-live="polite"></p><button type="submit">Convert temperature <span>↗</span></button></form><section class="results" aria-live="polite"><div class="results-head"><h2>Converted values</h2><span id="status">Waiting for input</span></div><div class="result-grid"><article class="result-card"><span>Celsius</span><strong id="celsius">—</strong><small>°C</small></article><article class="result-card"><span>Fahrenheit</span><strong id="fahrenheit">—</strong><small>°F</small></article><article class="result-card"><span>Kelvin</span><strong id="kelvin">—</strong><small>K</small></article></div></section><footer><span>Thermo · Simple tools for everyday science</span><span>Absolute zero aware</span></footer></main></body></html>
